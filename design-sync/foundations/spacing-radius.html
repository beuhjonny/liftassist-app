<!-- @dsCard group="Foundations" name="Spacing, radius, elevation" subtitle="4px grid, 4-8-12-16 radii, two-layer shadows" -->
<!doctype html><html><head><meta charset="utf-8"><title>Spacing</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet"><style>
  :root {
    --surface-base:#121212; --surface-raised:#1e1e1e; --surface-overlay:#242424; --surface-sunken:#171717;
    --text-primary:rgba(255,255,255,0.95); --text-secondary:rgba(255,255,255,0.70); --text-tertiary:rgba(255,255,255,0.52);
    --color-accent:#2563eb; --color-accent-contrast:#fff; --color-accent-strong:#1d4ed8; --color-accent-quiet:rgba(37,99,235,0.12); --color-accent-line:#4c8dff;
    --color-success-bg:#12271b; --color-success-fg:#6ee7a0; --color-success-line:rgba(110,231,160,0.28);
    --color-warning-bg:#2a2205; --color-warning-fg:#f5c451; --color-warning-line:rgba(245,196,81,0.28);
    --color-danger-bg:#2a1315; --color-danger-fg:#ff8a90; --color-danger-line:rgba(255,138,144,0.28);
    --color-hairline:rgba(255,255,255,0.08);
    --shadow-1:0 1px 2px rgba(0,0,0,0.5); --shadow-2:0 4px 14px rgba(0,0,0,0.55),0 1px 3px rgba(0,0,0,0.4);
    --radius-xs:4px; --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-full:999px;
    --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px; --space-6:32px;
    --tap-min:44px;
    --day-1:#4f6d8f; --day-2:#2f8f83; --day-3:#4d5bb5; --day-4:#c07a1e; --day-5:#8e5a86; --day-6:#a9603f;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--surface-base); color: var(--text-secondary); font-family: Inter, system-ui, sans-serif; font-size: 16px; line-height: 1.5; padding: 24px; }
  h1,h2,h3 { font-family: Montserrat, Inter, sans-serif; color: var(--text-primary); }
  .card { background: var(--surface-raised); border: 1px solid var(--color-hairline); border-radius: var(--radius-lg); box-shadow: var(--shadow-1); padding: var(--space-5); }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px; }
  .label { font-size: 12px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; margin: 20px 0 8px; }
</style></head><body>
  <div class="label">4px spacing grid</div>
  <div class="row"><div style="text-align:center"><div style="width:4px;height:24px;background:var(--color-accent)"></div><div style="font-size:11px;margin-top:4px">4</div></div><div style="text-align:center"><div style="width:8px;height:24px;background:var(--color-accent)"></div><div style="font-size:11px;margin-top:4px">8</div></div><div style="text-align:center"><div style="width:12px;height:24px;background:var(--color-accent)"></div><div style="font-size:11px;margin-top:4px">12</div></div><div style="text-align:center"><div style="width:16px;height:24px;background:var(--color-accent)"></div><div style="font-size:11px;margin-top:4px">16</div></div><div style="text-align:center"><div style="width:24px;height:24px;background:var(--color-accent)"></div><div style="font-size:11px;margin-top:4px">24</div></div><div style="text-align:center"><div style="width:32px;height:24px;background:var(--color-accent)"></div><div style="font-size:11px;margin-top:4px">32</div></div></div>
  <div class="label">Radii (xs 4 / sm 8 / md 12 / lg 16 / full)</div>
  <div class="row"><div style="text-align:center"><div style="width:64px;height:48px;background:var(--surface-sunken);border:1px solid var(--color-hairline);border-radius:4px"></div><div style="font-size:11px;margin-top:4px">xs</div></div><div style="text-align:center"><div style="width:64px;height:48px;background:var(--surface-sunken);border:1px solid var(--color-hairline);border-radius:8px"></div><div style="font-size:11px;margin-top:4px">sm</div></div><div style="text-align:center"><div style="width:64px;height:48px;background:var(--surface-sunken);border:1px solid var(--color-hairline);border-radius:12px"></div><div style="font-size:11px;margin-top:4px">md</div></div><div style="text-align:center"><div style="width:64px;height:48px;background:var(--surface-sunken);border:1px solid var(--color-hairline);border-radius:16px"></div><div style="font-size:11px;margin-top:4px">lg</div></div><div style="text-align:center"><div style="width:64px;height:48px;background:var(--surface-sunken);border:1px solid var(--color-hairline);border-radius:999px"></div><div style="font-size:11px;margin-top:4px">full</div></div></div>
  <div class="label">Elevation: hairline + shadow-1 vs shadow-2</div>
  <div class="row">
    <div class="card" style="width:180px;height:80px">resting</div>
    <div class="card" style="width:180px;height:80px;box-shadow:var(--shadow-2)">raised</div>
  </div>
  <div class="label">Tap floor 44px, control heights 48/56/64</div>
  <div class="row"><div style="min-width:80px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:1px dashed var(--color-accent-line);border-radius:8px;font-size:12px">44px</div><div style="min-width:80px;height:48px;display:inline-flex;align-items:center;justify-content:center;border:1px dashed var(--color-accent-line);border-radius:8px;font-size:12px">48px</div><div style="min-width:80px;height:56px;display:inline-flex;align-items:center;justify-content:center;border:1px dashed var(--color-accent-line);border-radius:8px;font-size:12px">56px</div><div style="min-width:80px;height:64px;display:inline-flex;align-items:center;justify-content:center;border:1px dashed var(--color-accent-line);border-radius:8px;font-size:12px">64px</div></div></body></html>
