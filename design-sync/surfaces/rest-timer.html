<!-- @dsCard group="Surfaces" name="Rest timer ring" subtitle="SVG progress ring, +30/-15 controls" -->
<!doctype html><html><head><meta charset="utf-8"><title>Rest timer</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet"><style>
  :root {
    --surface-base:#121212; --surface-raised:#1e1e1e; --surface-overlay:#242424; --surface-sunken:#171717;
    --text-primary:rgba(255,255,255,0.95); --text-secondary:rgba(255,255,255,0.70); --text-tertiary:rgba(255,255,255,0.52);
    --color-accent:#2563eb; --color-accent-contrast:#fff; --color-accent-strong:#1d4ed8; --color-accent-quiet:rgba(37,99,235,0.12); --color-accent-line:#4c8dff;
    --color-success-bg:#12271b; --color-success-fg:#6ee7a0; --color-success-line:rgba(110,231,160,0.28);
    --color-warning-bg:#2a2205; --color-warning-fg:#f5c451; --color-warning-line:rgba(245,196,81,0.28);
    --color-danger-bg:#2a1315; --color-danger-fg:#ff8a90; --color-danger-line:rgba(255,138,144,0.28);
    --color-hairline:rgba(255,255,255,0.08);
    --shadow-1:0 1px 2px rgba(0,0,0,0.5); --shadow-2:0 4px 14px rgba(0,0,0,0.55),0 1px 3px rgba(0,0,0,0.4);
    --radius-xs:4px; --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-full:999px;
    --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px; --space-6:32px;
    --tap-min:44px;
    --day-1:#4f6d8f; --day-2:#2f8f83; --day-3:#4d5bb5; --day-4:#c07a1e; --day-5:#8e5a86; --day-6:#a9603f;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--surface-base); color: var(--text-secondary); font-family: Inter, system-ui, sans-serif; font-size: 16px; line-height: 1.5; padding: 24px; }
  h1,h2,h3 { font-family: Montserrat, Inter, sans-serif; color: var(--text-primary); }
  .card { background: var(--surface-raised); border: 1px solid var(--color-hairline); border-radius: var(--radius-lg); box-shadow: var(--shadow-1); padding: var(--space-5); }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px; }
  .label { font-size: 12px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; margin: 20px 0 8px; }
</style></head><body>
  <div style="max-width:420px" class="card">
    <div style="text-align:center">
      <div style="position:relative;width:220px;margin:0 auto">
        <svg width="220" height="220" viewBox="0 0 220 220">
          <circle cx="110" cy="110" r="106" fill="none" stroke="var(--color-hairline)" stroke-width="8"/>
          <circle cx="110" cy="110" r="106" fill="none" stroke="var(--color-accent)" stroke-width="8" stroke-linecap="round"
            stroke-dasharray="666" stroke-dashoffset="200" transform="rotate(-90 110 110)"/>
        </svg>
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
          <span style="font-size:56px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;color:var(--text-primary)">1:14</span>
          <span style="font-size:12px;font-weight:700;letter-spacing:0.08em;color:var(--text-tertiary)">REST</span>
        </div>
      </div>
      <div style="display:flex;justify-content:center;gap:16px;margin-top:16px">
        <button style="min-width:64px;min-height:44px;border-radius:12px;border:1px solid var(--color-hairline);background:var(--surface-raised);color:var(--text-secondary);font-weight:600;cursor:pointer">-15s</button>
        <button style="min-width:64px;min-height:44px;border-radius:12px;border:1px solid var(--color-hairline);background:var(--surface-raised);color:var(--text-secondary);font-weight:600;cursor:pointer">+30s</button>
      </div>
      <button style="min-height:56px;width:100%;margin-top:16px;border:none;border-radius:12px;background:var(--color-accent-strong);color:#fff;font-weight:700;font-size:16px;cursor:pointer">Skip Rest</button>
    </div>
  </div></body></html>
